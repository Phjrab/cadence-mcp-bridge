name: Public synthetic verification
on:
  pull_request:
  push:
    branches: [main, "feat/grel-**"]
permissions:
  contents: read
concurrency:
  group: public-synthetic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-python312:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      UV_NO_PROGRESS: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout reviewed event commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
          set-safe-directory: false
      - name: Install fixed uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.6"
          checksum: "df7cb9f243eae1621400d4fcf5b1b3d90f20e264ece91b64deb3b0078abca6ef"
          enable-cache: false
      - name: Install locked public dependencies
        run: uv sync --locked --all-groups --python 3.12.10
      - name: Lint
        run: .venv/Scripts/python.exe -m ruff check src scripts tests
      - name: Type check
        run: .venv/Scripts/python.exe -m mypy src
      - name: Synthetic unit tests
        run: |
          $grelUnitTemp = Join-Path $env:RUNNER_TEMP ("grel-unit-" + [Guid]::NewGuid().ToString("N").Substring(0, 8))
          .venv/Scripts/python.exe -m pytest tests/unit -q --basetemp $grelUnitTemp
      - name: Security and locked dependency audit
        run: ./scripts/verify-security.ps1
      - name: Published contract compatibility
        run: .venv/Scripts/python.exe -I -X utf8 scripts/verify-release-readiness.py
      - name: Curated artifacts, installed protocol, bootstrap and state preservation
        run: ./scripts/verify-package.ps1

  posix-shared-reservations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      UV_NO_PROGRESS: "1"
    steps:
      - name: Checkout reviewed event commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
          set-safe-directory: false
      - name: Install fixed uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.6"
          checksum: "8681d8921e7d520fb368991dcf5f9c1905b80f5bf2a265a0ed085c8d8e342477"
          enable-cache: false
      - name: Install locked public dependencies
        run: uv sync --locked --all-groups --python 3.12.10
      - name: Install synthetic ACL test prerequisite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y acl
      - name: Actual files, process death and independent POSIX flock
        run: .venv/bin/python -I -X utf8 -m pytest tests/unit/test_shared_reservations.py tests/unit/test_installation_repair.py -q --basetemp "$HOME/grel-reservation-tests"

      - name: Operator launcher coexistence, recovery and shared lock
        run: .venv/bin/python -I -X utf8 -m pytest tests/unit/test_bootstrap.py -k operator -q --basetemp "$HOME/grel-operator-tests"

      - name: Existing domain migration on disposable files
        run: .venv/bin/python -I -X utf8 -m pytest tests/unit/test_domain_provisioning.py tests/unit/test_fresh_domain.py -q --basetemp "$HOME/grel-domain-tests"

      - name: Fresh storage and result counter policy consumers
        run: .venv/bin/python -I -X utf8 -m pytest tests/unit/test_storage_worker.py tests/unit/test_storage.py tests/unit/test_resource_policy.py -q --basetemp "$HOME/grel-consumer-tests"

      - name: OS-operator confirmation and append-only revocation on disposable files
        run: .venv/bin/python -I -X utf8 -m pytest tests/unit/test_operator_confirmation.py -q --basetemp "$HOME/grel-confirmation-tests"
