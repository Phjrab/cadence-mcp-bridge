[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cadence-mcp-bridge"
version = "1.0.0"
description = "Restricted Windows MCP bridge for a legacy Cadence environment"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Phjrab" }]
dependencies = [
    "mcp[cli]>=2,<3",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
]

[project.scripts]
cadence-mcp-bridge = "cadence_mcp_bridge.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pip-audit>=2.9,<3",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cadence_mcp_bridge"]

[tool.hatch.build.targets.sdist]
# Package source for rebuilding the wheel, not a copy of private operator state
# or imported planning material whose redistribution rights remain unverified.
include = [
    "/src",
    "/pyproject.toml",
    "/uv.lock",
    "/.gitignore",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/THIRD_PARTY_NOTICES.md",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"remote/py26/*.py" = ["B904", "UP010", "UP024", "UP030", "UP031", "UP032"]
"src/cadence_mcp_bridge/_environment_probe.py" = ["UP", "I", "SIM", "B"]
"src/cadence_mcp_bridge/_storage_worker.py" = ["UP", "I", "SIM", "B", "F821"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "cadence_mcp_bridge._storage_worker"
ignore_errors = true

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires the configured cadence-vm SSH target"]
